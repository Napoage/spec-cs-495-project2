<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="{{ url_for('static', filename='font/BebasNeue-Regular.ttf') }}" as="font" type="font/ttf" crossorigin="anonymous">
    <title>PIV Functions</title>
    <style>
        @font-face {
            font-family: 'Bebas Neue';
            src: url('{{ url_for("static", filename="font/BebasNeue-Regular.ttf") }}') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'Bebas Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            margin: 0;
            margin-top: 0;
            padding: 0;
            background-color: #f0f0f0;
            background-image: url("{{ url_for('static', filename='images/app_bg.jpg') }}");
            background-size: cover;
            background-attachment: fixed;
        }
                /* Banner Style */
        .banner {
            background-color: #ffcc00;
            color: #333;
            text-align: center;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            font-size: 1.2em;
            position: fixed;
            top: 0;
            z-index: 1000;
        }
        .spacer {
            height: 60px; /* Match the height of the banner */
            width: 100%;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 20px;
            box-sizing: border-box;
        }

        .logo {
            width: 80%;
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            width: 80%;
            max-width: 300px;
            margin-bottom: 0px;
        }
        button {
            background-color: #000;
            color: white;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 30px;
            font-family: 'Bebas Neue', sans-serif;
            text-align: center;
            transition: background-color 0.3s;
            
        }
        button:hover {
            background-color: #4571a0;
        }
        .highlighted-title {
            display: inline-block; /* Ensures the background only covers the text */
            background-color: white; /* Rectangle color */
            color: black; /* Text color */
            padding: 10px 20px; /* Padding to create space around the text */
            border-radius: 5px; /* Optional: Rounds the corners */
            font-family: 'Bebas Neue', sans-serif; /* Font styling */
            font-size: 30px; /* Adjust font size as needed */
            text-align: center; /* Center text if it spans multiple lines */
            width: 45%;
        }
        /* Responsive Design */
        @media (min-width: 600px) {
            .button-container {
                flex-direction: row;
                justify-content: space-between;
                max-width: 600px; /* Wider container on larger screens */
            }
            button {
                width: 48%; /* Two buttons per row */
                margin: 10px 1%;
            }
        }
        
        @media (max-width: 600px) {
            .logo img {
                margin-top: 0px; /* Add top margin for the logo in mobile view */
            }
            .highlighted-title{
                width: 65%;
            }        
        }

        @media (min-width: 900px) {
            body {
                max-width: 2000px; /* Limit width of content on larger screens */
            }

            .button-container {
                flex-direction: row; /* Arrange buttons in rows */
                flex-wrap: wrap; /* Allow wrapping to the next line if needed */
                justify-content: space-between; /* Distribute space evenly */
                max-width: 100%; /* Allow wider container for buttons */
            }

            button {
                font-size: 20px; /* Adjust font size for larger screens */
                flex: 1 1 30%; /* Buttons take 30% of the container's width */
                margin: 10px; /* Add margin between buttons */
                max-width: 200px; /* Optional: limit maximum button width */
            }
        }
        /*added content here*/
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4); /* Dim background */
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            font-size: 18px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
            animation: popup 0.25s ease-out;
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-buttons button:hover {
            background-color: #0064d4;
        }

        @keyframes popup {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>
    {% if g.process_running %}
        <div class="banner">PIV Process is running</div>
    {% endif %}
    <div id="customModal" class="modal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button id="modalOkBtn">OK</button>
            </div>
        </div>
    </div>
    <div class="spacer"></div>
    <div class="logo">
        <img src="{{ url_for('static', filename='images/SPEC_logo.png') }}" alt="Logo" style="width: 120%; height: auto; border-radius: 10px; ">
    </div>
    <h2 class="highlighted-title">PIV Functions</h2>
    <div class="content">

        <div class="button-container">
            
            <!--PIV-->
            <button onclick="location.href='/test'">Run Test</button>
            
            {% if g.process_running %}
                <button onclick="document.getElementById('stopPIVForm').submit();">Stop PIV</button>
                <form id="stopPIVForm" method="POST" action="{{ url_for('cancel_piv') }}" style="display: none;"></form>
            {% else %}
            
                <button onclick="location.href='/save_and_run'">Run PIV</button>
                {% endif %}

            <button onclick="location.href='/piv_functions_instructions'">Instructions</button>
            <button onclick="location.href='/splash'">Main Menu</button>
            <!--<button onclick="location.href='/logout'">Logout</button>-->
            
            <!--Test Confidence model intervals-->
            <!--<button onclick="document.getElementById('startAutoPIVForm').submit();">Start Auto PIV</button>
            <form id="startAutoPIVForm" method="POST" action="{{ url_for('start_auto_piv') }}" style="display: none;"></form>

            <button onclick="document.getElementById('stopAutoPIVForm').submit();">Stop Auto PIV</button>
            <form id="stopAutoPIVForm" method="POST" action="{{ url_for('stop_auto_piv') }}" style="display: none;"></form>-->

            <button id="startAutoPIVBtn">Start Auto PIV</button>
            <button id="stopAutoPIVBtn">Stop Auto PIV</button>



        </div>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/DA_logo.jpg') }}" alt="Logo" style="width: 40%; height: auto; ">
        </div>
    </div>
    <script>
        function cancelPIV() {
            fetch('/cancel_piv', {
                method: 'POST' // Sends a POST request to the /cancel_piv route
            })
            .then(response => response.json()) // Parse the JSON response from the server
            .then(data => {
                alert(data.message); // Show success message from the server
                window.location.reload(); // Reload the page after cancellation
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while cancelling PIV.'); // Show an error message if the request fails
            });
        }  
        // Function to handle saving data to USB without navigation
        function saveToUSB() {
            fetch('/save_to_usb', {
                method: 'POST' // Adjust based on the route method configuration
            })
            .then(response => response.json()) // Assuming the server returns JSON
            .then(data => {
                alert(data.message); // Show a success or error message from the server response
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while saving to USB.');
            });
        }
        // Check if there's an error message in the URL and decode it
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('error');
        if (errorMessage) {
            alert(decodeURIComponent(errorMessage));  // Display the decoded error message in a pop-up
        }

        const eventSource = new EventSource("/events");

        function showModal(message) {
            document.getElementById("modalMessage").innerText = message;
            document.getElementById("customModal").style.display = "flex";
        }

        document.getElementById("modalOkBtn").addEventListener("click", () => {
        document.getElementById("customModal").style.display = "none";
        });

        eventSource.addEventListener("message", (event) => {
        console.log("Event received:", event.data);

        switch (event.data) {
            case "auto_piv_started":
                showModal("✅ Auto PIV Loop Started!");
                break;
            case "threshold_crossed":
                showModal("⚠️ Threshold reached. PIV may need to run.");
                break;
            case "PIV Started":
                showModal("📡 PIV Run Started!");
                break;
            case "PIV Finished":
                showModal("🟢 PIV Complete!");
                break;
            case "auto_piv_stopped":
                showModal("🛑 Auto PIV Loop Stopped.");
                break;
            }
        });


        document.getElementById("startAutoPIVBtn").addEventListener("click", async () => {
            const res = await fetch("/start_auto_piv", { method: "POST" });
            const data = await res.json();
            console.log(data);
        });

        document.getElementById("stopAutoPIVBtn").addEventListener("click", async () => {
            const res = await fetch("/stop_auto_piv", { method: "POST" });
            const data = await res.json();
            console.log(data);
        });
        
    </script>
</body>
</html>
